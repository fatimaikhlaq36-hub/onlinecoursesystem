<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instructor Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      min-height: 100vh;
      padding: 30px;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
    }

    header p {
      opacity: 0.8;
      margin-top: 5px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }

    input {
      flex: 1;
      outline: none;
    }

    button {
      background: #00c9ff;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: #009acb;
      transform: scale(1.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 5px;
    }

    .subject {
      font-size: 14px;
      opacity: 0.8;
    }

    .delete-btn {
      margin-top: 10px;
      background: crimson;
      width: 100%;
    }

  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Instructor Management System</h1>
    <p>Manage instructors efficiently with modern UI</p>
  </header>

  <!-- Input Section -->
  <div class="top-bar">
    <input type="text" id="name" placeholder="Instructor Name">
    <input type="text" id="subject" placeholder="Subject">
    <button onclick="addInstructor()">Add Instructor</button>
  </div>

  <!-- Search -->
  <div class="top-bar">
    <input type="text" id="search" placeholder="Search instructor...">
  </div>
  <!-- Instructor List -->
  <div class="grid" id="instructorList">

</div>
<script>

async function loadInstructors() {

    try {

        const response =
        await fetch("http://127.0.0.1:3000/instructors");

        const data =
        await response.json();

        let output = "";

        data.forEach(instructor => {

            output += `
<div class="card">
    <h3>${instructor.InstructorName}</h3>
    <p class="subject">${instructor.Specialization}</p>
    <button class="delete-btn" onclick="deleteInstructor(${instructor.InstructorID})">Delete</button>
</div>`;

        });

        document.getElementById("instructorList")
        .innerHTML = output;

    }

    catch(error){

        console.log(error);

    }

}

loadInstructors();

async function addInstructor() {

    const name =
    document.getElementById("name").value;

    const subject =
    document.getElementById("subject").value;

    if(name === "" || subject === ""){

        alert("Please fill all fields");

        return;
    }

    try {

        const response = await fetch(

            "http://127.0.0.1:3000/addInstructor",

            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    subject: subject

                })

            }

        );

        const data = await response.text();

        alert(data);

        loadInstructors();

        document.getElementById("name").value = "";
        document.getElementById("subject").value = "";

    }

    catch(error){

        console.log(error);

    }

}
async function deleteInstructor(id) {
    if (!confirm("Delete this instructor?")) return;
    await fetch(`http://127.0.0.1:3000/deleteInstructor/${id}`, { method: "DELETE" });
    loadInstructors();
}
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
        const name = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = name.includes(query) ? "block" : "none";
    });
});

</script>
</body>
</html>
